<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokedex-jandtocode</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>

<body>
    <div class="contenedor">
        <header>
            <div class="titulo-pokedex">
                <img src="./img/title-pokedex.png" alt="título-pokedex">
            </div>
        </header>
        <main>
            <section class="pokemon">
                <div class="figura-pokemon">
                    <div class="contenedor-imagen">
                        <img class="imagen-pokemon" src="" alt="pokemon">
                    </div>
                    <p><span class="nombre-pokemon"></span></p>
                </div>

                <div class="info-pokemon">
                    <div class="datos-pokemon">
                        <table>
                            <thead>
                                <tr>
                                    <th>id</th>
                                    <th>familia</th>
                                    <th>evolución</th>
                                    <th>altura</th>
                                    <th>peso</th>
                                    <th>poderes</th>
                                    <th>debilidad</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="dato-id">---</td>
                                    <td class="dato-familia">-</td>
                                    <td class="dato-evolucion">-</td>
                                    <td class="dato-altura">-</td>
                                    <td class="dato-peso">-</td>
                                    <td class="dato-poderes">-</td>
                                    <td class="dato-debilidad">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="juegos-pokemon">
                        <table>
                            <thead>
                                <tr class="fila-juegos-cabecera">
                                    <th>Juegos</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="fila-juegos-marca">
                                    <th>Selecciona un pokémon</th>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="pokedex">
                <div class="contenedor-pokedex">
                    <div class="luz-pokedex"></div>
                    <div class="pantalla-pokedex">
                        <ul></ul>
                    </div>
                    <div class="botones-pokedex">
                        <div class="encendido-pokedex">
                            <button class="boton-pokedex" data-action="on">On</button>
                            <button class="boton-pokedex" data-action="off">Off</button>
                        </div>
                        <div class="d-pad">
                            <div class="brazo arriba" data-action="up"></div>
                            <div class="brazo izquierda" data-action="left"></div>
                            <div class="centro" data-action="select"></div>
                            <div class="brazo derecha" data-action="right"></div>
                            <div class="brazo abajo" data-action="down"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="buscador-pokemon">
                <div class="contenedor-buscador">
                    <input type="text" class="input-buscador" placeholder="Buscar Pokémon por nombre o id">
                    <button class="boton-buscador">Buscar</button>
                    <button class="boton-limpiar">Limpiar</button>
                </div>
            </section>
        </main>
        <footer>
            <div>
                <p>jandtocode - Esto es una página web para uso educativo</p>
                <p>mas información <a href="https://jandtocode.com" target="_blank">aquí</a></p>
            </div>
        </footer>
    </div>
    <script src="./js/pokedex.js" defer></script>
    <script src="./js/buscador-pokemon.js" defer></script>
</body>

</html>
